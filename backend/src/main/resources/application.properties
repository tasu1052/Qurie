# ===============================
# Application
# ===============================

spring.application.name=qurie


# ===============================
# Database
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===============================
# Security / JWT
# ===============================

jwt.secret=${JWT_SECRET}
app.cookie-secure=${COOKIE_SECURE:false}


# ===============================
# 파일 업로드 (초대 일괄 발송 · 강의자료)
# ===============================

# 강의자료(PDF 등)가 가장 큰 업로드다. 서비스 레이어의 파일당 상한(30MB)보다 살짝 크게 잡아
# 초과 시 스프링의 뭉툭한 413 대신 서비스의 안내 메시지가 나가게 한다. 초대 xlsx 는 5MB 면 충분.
spring.servlet.multipart.max-file-size=31MB
spring.servlet.multipart.max-request-size=32MB


# ===============================
# WebSocket
# ===============================

app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}


# ===============================
# CORS
# ===============================

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}


# ===============================
# Frontend
# ===============================

# 초대 메일에 담을 가입 링크의 베이스 URL
app.frontend.base-url=${FRONTEND_BASE_URL}


# ===============================
# AI (퀴즈 생성 FastAPI)
# ===============================

# 로컬은 uvicorn 기본 포트. 배포는 같은 EC2 의 ai 서비스 주소를 AI_BASE_URL 로 넣는다.
app.ai.base-url=${AI_BASE_URL:http://localhost:8000}

# AI 서버가 생성 완료 콜백을 보낼 백엔드 자신의 외부 접근 주소. 배포 시 반드시 채운다.
app.ai.callback-base-url=${AI_CALLBACK_BASE_URL:http://localhost:8080}

# 콜백 요청 검증용 공유 비밀. 비어있으면 검증을 건너뛴다(로컬 전용) — 배포 값은 AI 서버와 맞춰서 채운다.
app.ai.callback-secret=${AI_CALLBACK_SECRET:}


# ===============================
# Mail (초대 발송)
# ===============================

# SMTP 접속 정보는 환경변수로만 넣는다. SPRING_MAIL_HOST 가 없으면 JavaMailSender 빈 자체가 만들어지지 않고,
# 초대는 정상 생성되되 메일 발송만 건너뛴다(응답의 signUpUrl 로 수동 전달).
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:no-reply@qurie.com}
