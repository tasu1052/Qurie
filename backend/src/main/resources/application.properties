# ===============================
# Application
# ===============================

spring.application.name=qurie


# ===============================
# 에러 응답
# ===============================

# 컨트롤러가 ResponseStatusException 에 담은 reason 을 에러 본문의 message 필드로 노출한다.
# 기본값(never)이면 프론트가 읽는 data.message 가 비어 "그룹 리더만 가능" 같은 안내가 전부 사라진다.
server.error.include-message=always


# ===============================
# Database
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===============================
# Security / JWT
# ===============================

jwt.secret=${JWT_SECRET}
app.cookie-secure=${COOKIE_SECURE:false}


# ===============================
# 파일 업로드 (초대 일괄 발송 · 강의자료)
# ===============================

# 강의자료(PDF 등)가 가장 큰 업로드다. 서비스 레이어의 파일당 상한(30MB)보다 살짝 크게 잡아
# 초과 시 스프링의 뭉툭한 413 대신 서비스의 안내 메시지가 나가게 한다. 초대 xlsx 는 5MB 면 충분.
spring.servlet.multipart.max-file-size=31MB
spring.servlet.multipart.max-request-size=32MB


# ===============================
# API 문서 (springdoc / Swagger UI)
# ===============================

# 로컬은 별도 설정 없이 http://localhost:8080/swagger-ui.html 로 열린다.
# 운영은 docker-compose 가 SWAGGER_ENABLED=false 를 기본으로 넣어 명세 자체를 내리지 않는다(404).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}


# ===============================
# Actuator (성능 지표)
# ===============================

# 부하 테스트 중 서버 지표(커넥션 풀·스레드 등)를 보기 위해 health 외에 metrics 를 노출한다.
# 로컬은 기본 공개, 운영은 ACTUATOR_PUBLIC=false 로 화이트리스트에서 제외한다(SecurityConfig).
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,metrics}
app.actuator.public=${ACTUATOR_PUBLIC:true}

# 메일은 이 서비스에서 선택 기능(SMTP 미설정 시 발송만 건너뜀)인데, SMTP 가 차단된 네트워크에서
# 헬스체크가 전체 status 를 DOWN 으로 만들어 버려 헬스 판정에서 제외한다.
management.health.mail.enabled=false

# tomcat.threads.* 지표(부하 테스트 중 스레드 포화 관찰)는 MBean 레지스트리가 있어야 노출된다.
server.tomcat.mbeanregistry.enabled=true


# ===============================
# WebSocket
# ===============================

app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}


# ===============================
# CORS
# ===============================

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}


# ===============================
# Frontend
# ===============================

# 초대 메일에 담을 가입 링크의 베이스 URL
app.frontend.base-url=${FRONTEND_BASE_URL}


# ===============================
# AI (퀴즈 생성 FastAPI)
# ===============================

# 로컬은 uvicorn 기본 포트. 배포는 같은 EC2 의 ai 서비스 주소를 AI_BASE_URL 로 넣는다.
app.ai.base-url=${AI_BASE_URL:http://localhost:8000}

# AI 서버가 생성 완료 콜백을 보낼 백엔드 자신의 외부 접근 주소. 배포 시 반드시 채운다.
app.ai.callback-base-url=${AI_CALLBACK_BASE_URL:http://localhost:8080}

# 콜백 요청 검증용 공유 비밀. 비어있으면 검증을 건너뛴다(로컬 전용) — 배포 값은 AI 서버와 맞춰서 채운다.
app.ai.callback-secret=${AI_CALLBACK_SECRET:}


# ===============================
# Mail (초대 발송)
# ===============================

# SMTP 접속 정보는 환경변수로만 넣는다. SPRING_MAIL_HOST 가 없으면 JavaMailSender 빈 자체가 만들어지지 않고,
# 초대는 정상 생성되되 메일 발송만 건너뛴다(응답의 signUpUrl 로 수동 전달).
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

app.mail.from=${MAIL_FROM:no-reply@qurie.com}

# 도입 문의(/demo) 접수 메일 수신 주소. 비어 있으면 SPRING_MAIL_USERNAME 으로 보낸다.
# compose/.env 에 DEMO_MAIL_TO 를 꼭 넣어야 담당자 메일함으로 간다.
app.demo.mail.to=${DEMO_MAIL_TO:}
