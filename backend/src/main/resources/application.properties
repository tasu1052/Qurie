# ===============================
# Application
# ===============================

spring.application.name=qurie


# ===============================
# Database
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===============================
# Security / JWT
# ===============================

jwt.secret=${JWT_SECRET}
app.cookie-secure=${COOKIE_SECURE:false}


# ===============================
# WebSocket
# ===============================

app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}


# ===============================
# CORS
# ===============================

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}


# ===============================
# Frontend
# ===============================

# 초대 메일에 담을 가입 링크의 베이스 URL
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
