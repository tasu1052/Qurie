# 배포 구성: 백엔드(Spring Boot) + MySQL + 동시편집(collab) + 퀴즈 생성 AI(ai) 네 컨테이너.
# 프론트는 S3 로 따로 올리므로 여기에 없다.
#
# 값은 같은 디렉터리의 .env 에서 읽는다. 필요한 키는 .env.example 참고.
#   docker compose up -d --build
name: qurie

services:
  mysql:
    image: mysql:8.0
    container_name: qurie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 가 필요하다}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qurie}
      # 애플리케이션 전용 계정. root 로는 붙지 않는다.
      # 로컬 직접 실행용 DB_USERNAME/DB_PASSWORD 와 일부러 분리한다 — 로컬은 root 를 쓰는데
      # mysql 이미지는 MYSQL_USER=root 를 거부해서, 같은 변수를 공유하면 둘 중 하나가 깨진다.
      MYSQL_USER: ${MYSQL_USER:?.env 에 MYSQL_USER 가 필요하다 (root 는 쓸 수 없다)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env 에 MYSQL_PASSWORD 가 필요하다}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      # 컨테이너를 지워도 데이터는 남는다. 이 볼륨을 지우면 DB 가 초기화된다.
      - mysql-data:/var/lib/mysql
    ports:
      # 127.0.0.1 에만 바인딩한다 — 3306 을 공인 IP 로 열면 곧바로 스캔 대상이 된다.
      # 호스트 쪽은 13306 이다. 개발 PC 에 이미 로컬 MySQL 이 3306 을 쓰고 있어 충돌하기 때문이다.
      # 백엔드 컨테이너는 이 포트를 쓰지 않고 내부 네트워크로 mysql:3306 에 붙는다.
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    healthcheck:
      # 비밀값을 compose 치환이 아니라 컨테이너 환경변수에서 읽도록 $$ 로 escape 한다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ./backend
    image: qurie-backend:latest
    container_name: qurie-backend
    restart: unless-stopped
    depends_on:
      # ddl-auto=update 라 부팅 시점에 DB 가 살아 있어야 한다. 단순 depends_on 만으로는 부족하다.
      mysql:
        condition: service_healthy
    environment:
      # 호스트명은 localhost 가 아니라 compose 서비스명(mysql)이다.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-qurie}?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 이 필요하다 (HS256 이라 32바이트 이상)}
      # HTTPS 로 서비스할 때만 true. HTTP 로 열면 쿠키가 브라우저에서 버려진다.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:?.env 에 프론트 배포 주소가 필요하다}
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:?.env 에 프론트 배포 주소가 필요하다}
      # 초대 메일 링크의 베이스 주소. 프론트 배포 주소와 같아야 한다.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?.env 에 프론트 배포 주소가 필요하다}
      # 퀴즈 생성 AI 서버. 같은 compose 네트워크라 서비스명으로 서로 붙는다(collab이 backend를 찾는 것과 동일 패턴).
      AI_BASE_URL: http://ai:8000
      # AI 가 생성 완료 콜백을 보낼 백엔드 자신의 주소. 컨테이너 기준이라 backend(서비스명)다.
      AI_CALLBACK_BASE_URL: http://backend:8080
      # 비어있으면 콜백 인증을 건너뛴다 — 채우려면 ai 서비스 쪽과 같은 값으로 맞춘다.
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:-}
      # API 명세(Swagger UI) 노출 여부. 운영 기본값은 끔 — 명세는 로컬에서 뽑는다.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TZ: Asia/Seoul
      # SMTP. .env 에 값이 없으면 빈 문자열이 그대로 들어가 JavaMailSender 빈이 잘못된 host 로
      # 만들어진다 — 이 다섯 줄을 살리려면 .env 에 실제 값을 반드시 먼저 채워야 한다.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      # 도입 문의(/demo) 수신함. 비우면 SMTP 계정(SPRING_MAIL_USERNAME)으로 폴백.
      DEMO_MAIL_TO: ${DEMO_MAIL_TO:-}
    ports:
      # 앞단의 nginx 가 127.0.0.1:8080 으로 프록시한다. 0.0.0.0 에 열면 nginx(HTTPS)를 우회해
      # 평문 8080 으로 직접 접속할 수 있고, docker 가 iptables 를 직접 건드려 ufw 로도 막히지 않는다.
      - "127.0.0.1:8080:8080"

  collab:
    build:
      context: ./collab-server
    image: qurie-collab:latest
    container_name: qurie-collab
    restart: unless-stopped
    environment:
      # 백엔드가 발급한 ACCESS_TOKEN 쿠키를 같은 시크릿으로 검증한다.
      JWT_SECRET: ${JWT_SECRET}
      # 세션 입장 자격(반 명단·활성 여부)은 백엔드에 위임 확인한다. 호스트명은 compose 서비스명.
      BACKEND_BASE_URL: http://backend:8080
      # y-websocket LevelDB 영속화. 전원 퇴장·컨테이너 재시작 후에도 편집본을 복원한다.
      YPERSISTENCE: /data/yjs
      TZ: Asia/Seoul
    volumes:
      - collab-yjs-data:/data/yjs
    ports:
      # backend 와 같은 이유로 127.0.0.1 에만 연다. nginx 에 /yjs → 127.0.0.1:1234
      # WebSocket 프록시(Upgrade 헤더 포함) location 을 추가해야 브라우저가 붙을 수 있다.
      - "127.0.0.1:1234:1234"
    healthcheck:
      # slim 이미지에는 wget/curl 이 없어 node 로 확인한다.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./ai_service
    image: qurie-ai:latest
    container_name: qurie-ai
    restart: unless-stopped
    environment:
      # 비어있으면 AI_MOCK=1 로만 돌릴 수 있고, 실제 LLM 호출은 이 키가 있어야 한다.
      GMS_API_KEY: ${GMS_API_KEY:-}
      AI_MOCK: ${AI_MOCK:-0}
      # 콜백 요청에 실어 보낼 값. backend 의 AI_CALLBACK_SECRET 과 같은 값이어야 검증을 통과한다.
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:-}
      # 발표 시연용. 1 이면 교차검증(SOLVE·JUDGE)을 건너뛰고 요청 개수를 그대로 채운다.
      # 품질 보증이 사라지므로 시연이 끝나면 서버 .env 에서 반드시 지운다.
      AI_DEMO_MODE: ${AI_DEMO_MODE:-0}
      TZ: Asia/Seoul
    ports:
      # 로컬에서 직접 찔러볼 때만 쓴다. 백엔드는 이 포트가 아니라 컨테이너 네트워크로 ai:8000 에 붙는다.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # slim 이미지에는 curl/wget 이 없어 파이썬으로 확인한다.
      test: ["CMD", "python", "-c",
        "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  collab-yjs-data:
