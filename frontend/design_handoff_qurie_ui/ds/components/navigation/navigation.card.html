<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body><div id="root"></div>
<script type="text/babel">
const {Sidebar,Topbar,Chevron}=window.QurieDesignSystem_1efd37;
function LIcon({name,size=16}){return React.createElement('i',{ref:el=>{if(el&&!el.dataset.done){el.dataset.done=1;lucide.createIcons({attrs:{width:size,height:size,'stroke-width':1.75}})}},'data-lucide':name,style:{display:'inline-flex',width:size,height:size}})}
function Demo(){
const [key,setKey]=React.useState('dash');
const items=[{key:'dash',label:'대시보드',icon:<LIcon name="layout-dashboard"/>},{key:'classes',label:'클래스',icon:<LIcon name="book-open"/>,badge:4},{key:'quiz',label:'AI 퀴즈',icon:<LIcon name="brain"/>},{key:'members',label:'멤버',icon:<LIcon name="users"/>}];
return <div style={{display:'flex',flexDirection:'column',height:330}}>
<Topbar breadcrumbs={['알고리즘 스터디','대시보드']} userName="김지원" userRole="ADMIN" searchIcon={<LIcon name="search" size={15}/>}/>
<div style={{display:'flex',flex:1,minHeight:0}}>
<Sidebar items={items} activeKey={key} onSelect={setKey} logoSrc="../../assets/logo-cropped.png"/>
<div style={{flex:1,padding:20,display:'flex',alignItems:'flex-start',gap:8,fontSize:14,color:'var(--text-secondary)'}}>브랜드 chevron <Chevron/> — breadcrumb 구분자, 펼침 표시, 다음 단계 화살표에만 사용</div>
</div>
</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
