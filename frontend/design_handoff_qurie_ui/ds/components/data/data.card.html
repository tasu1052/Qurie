<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const {StatCard,DataTable,Badge}=window.QurieDesignSystem_1efd37;
const rows=[{id:1,name:'김지원',email:'jiwon@corp.com',status:'ACCEPTED'},{id:2,name:'Lee Hana',email:'hana@corp.com',status:'PENDING'},{id:3,name:'Choi Min',email:'mchoi@corp.com',status:'EXPIRED'}];
const map={ACCEPTED:'success',PENDING:'warning',EXPIRED:'error'};
const cols=[{key:'name',label:'이름',sortable:true,render:r=><span style={{fontWeight:600,color:'var(--ink)'}}>{r.name}</span>},{key:'email',label:'이메일',render:r=><span style={{fontFamily:'var(--font-mono)',fontSize:13}}>{r.email}</span>},{key:'status',label:'초대 상태',render:r=><Badge status={map[r.status]}>{r.status}</Badge>}];
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'flex',flexDirection:'column',gap:16}}>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>
<StatCard value="128" label="활성 학생" delta="+4.2%" deltaDirection="up" caption="지난 주 대비"/>
<StatCard value="1,024" label="리뷰된 Commit" delta="+12.4%" deltaDirection="up" caption="지난 주 대비"/>
<StatCard accent value="87%" label="퀴즈 평균 정답률" delta="+2.1%" deltaDirection="up" caption="전체 세션"/>
</div>
<div style={{background:'var(--surface-card)',border:'1px solid var(--border)',borderRadius:'var(--card-radius)',boxShadow:'var(--shadow-card)',overflow:'hidden'}}><DataTable columns={cols} rows={rows}/></div>
</div>);
</script></body></html>
